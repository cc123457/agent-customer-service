name: CI

# 触发时机：推送到 main 分支，或向 main 提交 Pull Request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # 起一个 Redis 服务容器，供限流/会话记忆测试使用
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. 拉取代码
      - uses: actions/checkout@v4

      # 2. 安装 Python 3.13
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # 3. 安装项目依赖（运行依赖 + 开发/测试依赖）
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # 4. 运行单元测试
      - name: 运行测试
        run: python -m pytest tests/ -v
