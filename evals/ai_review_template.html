<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>记忆回答 · AI复核结果</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#20313e;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:28px}h1{font-size:26px;margin:0 0 8px}h2{font-size:17px;margin:0 0 8px}p{margin:8px 0}.muted{font-size:13px;color:#5b6c78}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.card,article{border:1px solid #dce5ea;background:white;border-radius:12px;padding:20px}.count{font-size:29px;font-weight:700;color:#185b78}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}select,input{font:inherit;padding:8px;border:1px solid #b9cbd6;border-radius:6px}input[type=search]{width:320px;max-width:100%}article{margin:18px 0}.answer{padding:12px 16px;background:#edf5f9;border-radius:8px;white-space:pre-wrap}.judgments{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.judgments>div{border:1px solid #e0e7eb;border-radius:8px;padding:12px}.ok{color:#176847}.bad{color:#a03c2f}pre{white-space:pre-wrap;word-break:break-word;font:inherit;background:#f6f8fa;padding:12px;border-radius:6px}.tag{font-size:12px;color:#4d6574}summary{cursor:pointer}.warning{color:#98611c}@media(max-width:700px){main{padding:16px}.cards,.judgments{grid-template-columns:1fr 1fr}.cards .card{padding:12px}.judgments{grid-template-columns:1fr}input[type=search]{width:100%}}</style>
<main><h1>记忆回答 · AI复核结果</h1><p>逐条检查完整历史、模型实际输入和最终回答，分开记录任务是否完成、回答是否有依据。</p><p class="muted">单一AI评审，参与过数据和指标实现；不是独立人工评分。没有改写原始答案，也没有重跑千问。完整历史有答案，不代表当时模型看到了答案。</p><div id="cards" class="cards"></div><div class="toolbar"><select id="arm"><option value="all">全部方案</option></select><label><input id="failed" type="checkbox"> 仅看任务未通过</label><label><input id="disputed" type="checkbox"> 仅看有歧义的判定</label><input id="search" type="search" placeholder="搜索问题、编号或复核理由"><span id="count" class="muted"></span></div><div id="items"></div></main>
<script id="data" type="application/json">__AI_REVIEW_DATA__</script><script>
"use strict";const data=JSON.parse(document.getElementById("data").textContent),names={recent:"仅近期消息",summary_recent:"摘要＋近期",memory:"当前记忆",full_history:"完整历史"},labels={supported_answer:"有依据且答对",justified_abstention:"按实际输入拒答合理",unsupported_answer:"缺少依据仍给出答案",incorrect_answer_with_evidence:"有证据但答错／违背约束",appropriate_forgetting:"文字遵守遗忘，标记需另看",unwarranted_abstention:"有依据却拒答",incomplete_answer_with_evidence:"有依据但回答不完整"};
const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;},byId=id=>document.getElementById(id);
for(const arm of ["recent","summary_recent","memory","full_history"]){const value=data.arms[arm],card=el("div",undefined,"card");card.append(el("h2",names[arm]),el("div",`${value.ai_task_passed}/${value.answers}`,"count"),el("p","AI任务通过数","muted"));byId("cards").append(card);const option=el("option",names[arm]);option.value=arm;byId("arm").append(option);}
function judge(label,value){const node=el("p");node.append(el("span",label+"："),el("strong",value?"是":"否",value?"ok":"bad"));return node;}
function render(){const query=byId("search").value.toLowerCase(),arm=byId("arm").value;
const rows=data.records.filter(row=>(arm==="all"||row.arm===arm)&&(!byId("failed").checked||!row.ai_task_passed)&&(!byId("disputed").checked||row.needs_human_review)&&(!query||JSON.stringify(row).toLowerCase().includes(query)));
byId("count").textContent=`显示 ${rows.length} / ${data.coverage.total} 条`;byId("items").replaceChildren();for(const row of rows){const article=el("article");article.append(el("p",`${names[row.arm]} · ${row.case_id} · ${row.blind_id}`,"tag"),el("h2",row.question),el("div",row.answer,"answer"),el("p",`模型填写的拒答标记：abstain = ${row.abstain}`,"muted"));
const judgments=el("div",undefined,"judgments"),task=el("div"),context=el("div");task.append(el("h2","完整历史上的任务结果"),judge("答案内容正确",row.task_content_correct),judge("拒答符合任务要求",row.task_abstention_correct),judge("没有泄露禁止值",row.no_forbidden_disclosure));context.append(el("h2","基于模型当时实际输入"),el("p",labels[row.context_behavior]||row.context_behavior),judge("回答行为有依据",row.context_response_supported),judge("拒答标记符合实际输入",row.context_abstention_correct));judgments.append(task,context);article.append(judgments,el("p",row.reason));if(row.needs_human_review)article.append(el("p","此判定存在解释歧义，已保留待进一步复核标记。","warning"));
const details=el("details"),summary=el("summary","查看原文引用与回答证据");details.append(summary);for(const evidence of row.evidence){const label=evidence.source==="history"?"完整历史原文 · "+evidence.id:evidence.source==="context"?"实际输入 · 消息索引 "+evidence.index:"模型原始JSON";details.append(el("p",label,"tag"),el("pre",evidence.quote));}article.append(details);byId("items").append(article);}}
for(const id of ["arm","failed","disputed"])byId(id).onchange=render;byId("search").oninput=render;render();
</script></html>
